{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h1>
        {{ note.Question }}
    </h1>

    <br>

    <p style="color:#4caf50;">
        Category: {{ note.category }}
    </p>

    <br>

    <p>
        Created:
        {{ note.created_at }}
    </p>

    <hr>

    <br>

    <h3>Answer</h3>

    <br>

    <p style="white-space:pre-line;">
        {{ note.Answer }}
    </p>

    <br><br>


    <a href="{% url 'update_note' note.id %}"
       class="btn">
        Edit
    </a>


    <form
        method="POST"
        action="{% url 'delete_note' note.id %}"
        style="display:inline;"
    >

        {% csrf_token %}

        <button
            type="submit"
            class="btn"
            onclick="return confirm('Are you sure you want to delete this note?')"
        >
            Delete
        </button>

    </form>

</div>

{% endblock %}
