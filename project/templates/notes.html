{% extends 'base.html' %}

{% block content %}

<h1>All Notes</h1>

<br>

<a href="{% url 'add_note' %}" class="btn">
    + Add New Note
</a>

<br><br>


{% if notes %}

<div style="
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
">

{% for note in notes %}

<div class="card">

    <h2>{{ note.Question }}</h2>

    <p style="color:#4caf50;">
        {{ note.category }}
    </p>

    <p>
        {{ note.Answer|truncatewords:20 }}
    </p>

    <br>

    <a href="{% url 'note_detail' note.id %}"
       class="btn">
        View
    </a>

</div>

{% endfor %}

</div>

{% else %}

<p>No notes available.</p>

{% endif %}

{% endblock %}
